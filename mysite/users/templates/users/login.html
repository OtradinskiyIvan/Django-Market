{% extends 'base.html' %}
{% block content %}
    <div class="auth-card">
        <h1>{{ title }}</h1>
        <form action="" method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors }}</div>{% endif %}
            {% for fel in form %}
            <p><label class='form-label' for="{{ fel.id_for_label }}">{{ fel.label }} : </label>{{ fel }}</p>
            {% if fel.errors %}<div class='form-error'>{{ fel.errors }}</div>{% endif %}
            {% endfor %}

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
        <p class="auth-alt"><a href="{% url 'password_reset' %}">Forgot the password?</a></p>
    </div>
{% endblock %}

{% extends 'base.html' %}
{% block content %}
    <h1>{{ title }}</h1>
    <form action="" method="post">
        {% csrf_token %}
        
        {% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors }}</div>{% endif %}
        {% for fel in form %}
        <p><label class='form-label' for="{{ fel.id_for_label}}">{{ fel.label }} : </label>{{ fel }}</p>
        {% if fel.errors %}<div class='form-error'>{{ fel.errors }}</div>{% endif %}
        {% endfor %}

        <button type="submit">Submit</button>
    </form>
{% endblock %}

{% extends 'base.html' %}
{% load catalog_tags %}
{% block content %}
    <h1>{{ title }}</h1>
    {% if items_list %}
        <div class="product-grid">
            {% for item in items_list %}
                {% include 'catalog/includes/product_card.html' %}
            {% endfor %}
        </div>
    {% else %}
        <div class="empty-state">
            {% icon 'heart' %}
            <p>Favorites list is empty.</p>
        </div>
    {% endif %}
{% endblock %}

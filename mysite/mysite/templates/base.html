{% load static %}
{% load catalog_tags %}


<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link href="{% static 'catalog/css/style.css' %}" rel="stylesheet" />
</head>
<body>
    <h1>Menu</h1>
    <ul>
        <li><a href="{% url 'catalog_main' %}">Main page</a></li>
        {% for el in menu %}
        {% if not forloop.last %}<li>{% else %}<li class="last">{% endif %}
            <a href="{% url el.url %}">{{ el.title }}</a>
        </li>
        {% endfor %}
    </ul>
    {% show_tags %}
    {% show_cats %}
    {% block content %} {% endblock %}
</body>
</html>
